# dns.ini - dmsystem unit that loads and enables the dmdns module at boot,
# so host names can be resolved (dmdns_resolve(), nslookup) with no manual
# step. Drop it into libsystemd's units directory - see docs/service.md and
# dmsystem's configuration docs (https://github.com/choco-technologies/dmsystem/blob/main/app/libsystemd/docs/configuration.md#typelibrary-services-backed-by-a-library-module-not-a-process).
description=DNS resolver (dmdns)
exec=dmdns
type=library

# type=library: dmdns is a Library-type DMOD module, not an Application - it
# has no main(), so it cannot be spawned as a process. libsystemd loads and
# enables it on "service start dns" (dmod_init() sets up the server list,
# hosts table and cache) and disables and unloads it on "service stop dns".
#
# One unit for the whole system, no per-interface rules: the resolver's
# state (server list, hosts table, cache) is global, and per-interface name
# servers - e.g. the ones a DHCP lease on eth0 offered - are not pushed into
# dmdns but asked for on every lookup through the dmdns_provide_servers DIF.
# An interface coming or going therefore needs nothing from this unit.
